<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Jimothy</title>
  <!-- Jimothy's icon (readme.md, "Brand"): Seattle's short-spined raccoon, hips high and head low,
       waddling down a route through the woods, framed by a pine-green hive cell. -->
  <defs>
    <clipPath id="hive"><path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z"/></clipPath>
    <clipPath id="tail"><path d="M25.5 34.5 C 20 34.5, 15.5 38, 14.5 42.5 C 15.5 44.8, 18.5 44, 20.5 42 C 22.5 40, 24 39.3, 26 39.3 Z"/></clipPath>
  </defs>
  <g clip-path="url(#hive)">
    <!-- woodland -->
    <rect width="64" height="64" fill="#CFE6EE"/>
    <path d="M14 8 L22 30 L6 30 Z" fill="#3F7D52"/>
    <path d="M14 16 L24 38 L4 38 Z" fill="#2F6B45"/>
    <rect x="12.6" y="38" width="2.8" height="6" fill="#6B4A2E"/>
    <path d="M52 6 L61 30 L43 30 Z" fill="#3F7D52"/>
    <path d="M52 15 L63 40 L41 40 Z" fill="#2F6B45"/>
    <rect x="50.6" y="40" width="2.8" height="5" fill="#6B4A2E"/>
    <path d="M0 45 Q 20 41 40 44 T 64 43 L64 64 L0 64 Z" fill="#6FA35A"/>
    <ellipse cx="30.5" cy="49.6" rx="12" ry="1.6" fill="#5A8C48"/>
    <!-- the route: a start waypoint and a dotted path -->
    <path d="M16.5 51 C 19 51, 21 50, 25 48.5" fill="none" stroke="#1B2027" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.01 5" stroke-dashoffset="-1.5"/>
    <circle cx="16.5" cy="51" r="3.2" fill="#1B2027"/>

    <!-- Jimothy. Short spine: no waist, hips high over long hind legs, head carried low. -->
    <g transform="translate(-3.5 0)">
    <!-- far legs -->
    <path d="M32.5 39 L32.8 47.5 C 32.8 49, 35.8 49, 35.8 48 L 35.6 39 Z" fill="#4A5058"/>
    <path d="M42 40 L42.3 48 C 42.3 49.2, 45 49.2, 45 48.2 L 44.6 39.5 Z" fill="#4A5058"/>
    <!-- tail, ringed -->
    <g transform="translate(2.5 -2)">
    <path d="M25.5 34.5 C 20 34.5, 15.5 38, 14.5 42.5 C 15.5 44.8, 18.5 44, 20.5 42 C 22.5 40, 24 39.3, 26 39.3 Z" fill="#9AA3AD"/>
    <g clip-path="url(#tail)" fill="#3A3F47">
      <rect x="13" y="30" width="3.4" height="18" transform="rotate(35 16 40)"/>
      <rect x="18.5" y="30" width="2.4" height="18" transform="rotate(35 20 38)"/>
      <rect x="22.8" y="30" width="2" height="18" transform="rotate(35 23.5 37)"/>
    </g>
    </g>
    <!-- body: a compact hump -->
    <path d="M27 41 C 25 32, 28 25.5, 32.5 25.8 C 37 26.2, 40.5 30, 42.5 34.5 L 43 42 C 38 45, 31.5 45, 27 41 Z" fill="#8C949C"/>
    <path d="M26.6 34 C 27 28, 29.5 25.6, 32.5 25.8 C 37 26.2, 40.3 29.8, 42.2 33.8 C 37.5 30.8, 31.5 30.6, 26.6 34 Z" fill="#6E767F"/>
    <path d="M29 43 C 33 45.2, 38.5 45, 43 42 L 42.8 40 C 38 42.4, 33 42.4, 29 41 Z" fill="#B5BCC3"/>
    <!-- near hind leg: a big haunch high on the body, long lower leg -->
    <path d="M26.4 35 C 26 29.5, 30 28.3, 32.3 30.5 C 34 32.5, 33.8 37.5, 32 40.5 L 31.2 47.6 C 31.2 49.2, 27.6 49.4, 27.4 48 L 27.6 42.5 C 26.8 40, 26.5 37.5, 26.4 35 Z" fill="#7D858D"/>
    <path d="M27.3 47 C 27.3 49.6, 31.4 49.6, 31.3 47 Z" fill="#2A2E35"/>
    <!-- near front leg: short and slim under a low shoulder -->
    <path d="M38.2 39 C 38.8 37.5, 41.8 37.5, 42 39.5 L 41.8 47.8 C 41.8 49.3, 38.6 49.3, 38.6 48 Z" fill="#7D858D"/>
    <path d="M38.5 47.2 C 38.4 49.6, 42 49.6, 41.9 47.2 Z" fill="#2A2E35"/>
    <!-- head, carried low and forward -->
    <g transform="translate(0 1)">
    <path d="M42.3 32 C 41.8 29.6, 42.8 28.4, 44.2 28.6 C 45.4 29.2, 45.8 30.6, 45.4 32 Z" fill="#C9CFD5"/>
    <path d="M43 31.6 C 42.8 30.2, 43.3 29.5, 44 29.6 C 44.7 30, 44.9 30.8, 44.7 31.6 Z" fill="#4A5058"/>
    <path d="M46 31.4 C 46 29.2, 47.2 28.2, 48.5 28.6 C 49.4 29.3, 49.4 30.7, 48.7 32 Z" fill="#C9CFD5"/>
    <path d="M46.7 31.2 C 46.7 30, 47.3 29.4, 48 29.6 C 48.5 30, 48.5 30.8, 48.1 31.5 Z" fill="#4A5058"/>
    <path d="M41 33.5 C 43 30.8, 48 30.8, 50.2 33.4 C 51.8 35, 53.6 36.5, 55.2 38 C 55.6 39.2, 54.6 40, 53 40.2 C 50 41.2, 45.5 42.2, 42.4 40.6 C 40.4 39, 40 35.5, 41 33.5 Z" fill="#9AA3AD"/>
    <path d="M48.4 37.2 C 50.6 36, 53.4 36.8, 55.2 38 C 55.6 39.2, 54.6 40, 53 40.2 C 51 40.8, 48.6 40.4, 47.8 39.2 Z" fill="#FFFFFF"/>
    <path d="M43.2 35.6 C 44.8 33.7, 48.6 33.9, 51 36.2 C 50.2 37.7, 48 38.3, 46 38.1 C 44.4 37.9, 43.3 37.1, 43.2 35.6 Z" fill="#1B2027"/>
    <path d="M43.6 34.3 C 45.5 32.4, 49 32.7, 51.2 35.1" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="48.3" cy="35.8" r="0.65" fill="#FFFFFF"/>
    <ellipse cx="55" cy="38.4" rx="1.3" ry="1" fill="#1B2027"/>
    </g>
    </g>
  </g>
  <!-- the BioBuzz hive cell -->
  <path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z" fill="none" stroke="#24553A" stroke-width="4" stroke-linejoin="round"/>
</svg>
